# NetworkManager drop-in: prevent NM from managing OVN BGP agent EVPN interfaces
#
# Deploy to: /etc/NetworkManager/conf.d/99-ovn-bgp-agent-unmanaged.conf
# Apply on:  all EDPM compute and networker nodes
# Reload:    sudo nmcli general reload conf
#
# Problem this solves:
#   The ovn-bgp-agent creates br-<vni>, vxlan-<vni>, and vrf-<vni> externally
#   via ip-link, then enslaves the bridge to the VRF device. NetworkManager
#   tracks these as external/volatile connections with [.nmmeta] external=true.
#   If NM loses that metadata (e.g. after nmcli reload or NM restart), it takes
#   full ownership. On the next link bounce, NM re-creates br-<vni> from its
#   stored profile, which has no connection.master=vrf-<vni>. The bridge comes
#   up in the default VRF, inbound VXLAN-decapsulated traffic is routed in the
#   wrong table, and all FIPs on that node become unreachable inbound while
#   outbound continues working (nexthop cache keeps the stale route alive).
#
# Interface naming conventions matched (all use numeric VNI suffix):
#   br-<vni>     L3VNI SVI bridge        e.g. br-100, br-200
#   vxlan-<vni>  VXLAN tunnel endpoint   e.g. vxlan-100, vxlan-200
#   vrf-<vni>    VRF master device       e.g. vrf-100, vrf-200
#
# Interfaces intentionally NOT matched (OVS bridges have non-numeric suffixes):
#   br-bgp, br-int, br-ex, br-az3-vlan, etc.
#
# The interface-name:~<regex> specifier uses POSIX extended regex. Anchors are
# required because NM applies the regex with g_regex_match() (unanchored by
# default). Without ^/$, "br-[0-9]+" would also match "mybr-100".
#
# How to confirm the problem is present on a node:
#   ip link show br-100        # "master vrf-100" MUST appear; if absent, broken
#   sudo nmcli connection show br-100 | grep master  # "--" means NM owns it
#   sudo podman exec frr vtysh -c 'show interface br-100' | grep vrf  # must be vrf-100

[keyfile]
unmanaged-devices=interface-name:~^br-[0-9]+$;interface-name:~^vxlan-[0-9]+$;interface-name:~^vrf-[0-9]+$
