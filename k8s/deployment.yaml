apiVersion: apps/v1
kind: Deployment
metadata:
  name: snat-heartbeat-dashboard
  namespace: snat-test
  labels:
    app: snat-heartbeat-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snat-heartbeat-dashboard
  template:
    metadata:
      labels:
        app: snat-heartbeat-dashboard
    spec:
      containers:
        - name: dashboard
          image: quay.signal9.gg/aaustin/snat-test-dashboard@sha256:90fcb3496af22147ebce526a4aa89101ece8c7b37c2e8ae04f317cd5f2c50101
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: STATE_FILE
              value: "/data/heartbeat-state.json"
            - name: LOAD_TEST_STATUS_FILE
              value: "/data/load-test-status.json"
          volumeMounts:
            - name: heartbeat-state
              mountPath: /data
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: heartbeat-state
          persistentVolumeClaim:
            claimName: heartbeat-state
