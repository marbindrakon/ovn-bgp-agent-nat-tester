apiVersion: apps/v1
kind: Deployment
metadata:
  name: snat-heartbeat-dashboard
  namespace: snat-test
  labels:
    app: snat-heartbeat-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snat-heartbeat-dashboard
  template:
    metadata:
      labels:
        app: snat-heartbeat-dashboard
    spec:
      containers:
        - name: dashboard
          image: quay.signal9.gg/aaustin/snat-test-dashboard@sha256:dfa4aa233a3a7694b1eac09b683c65a1035e112ef360b821bf679efbe0b380a2
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: STATE_FILE
              value: "/data/heartbeat-state.json"
            - name: LOAD_TEST_STATUS_FILE
              value: "/data/load-test-status.json"
            - name: LOAD_TEST_HISTORY_FILE
              value: "/data/load-test-history.json"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: dashboard-api-key
                  key: api-key
          volumeMounts:
            - name: heartbeat-state
              mountPath: /data
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: heartbeat-state
          persistentVolumeClaim:
            claimName: heartbeat-state
