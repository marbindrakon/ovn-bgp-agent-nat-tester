#cloud-config

write_files:
  - path: /usr/local/bin/heartbeat-agent.py
    permissions: '0755'
    content: |
      #!/usr/bin/env python3
      """SNAT Test Heartbeat Agent"""

      import json
      import ssl
      import subprocess
      import time
      import urllib.error
      import urllib.request
      from collections import deque
      from datetime import datetime, timezone

      DASHBOARD_URL = "https://snat-heartbeat.apps.lab-hub.lab.signal9.gg/heartbeat"
      DASHBOARD_API_KEY = "@@DASHBOARD_API_KEY@@"
      HEARTBEAT_INTERVAL = 10
      MAX_RECENT_FAILURES = 20


      def get_metadata():
          try:
              req = urllib.request.urlopen(
                  "http://169.254.169.254/openstack/latest/meta_data.json",
                  timeout=5)
              return json.loads(req.read())
          except Exception:
              return {}


      def get_primary_ip():
          try:
              out = subprocess.run(
                  ["hostname", "-I"],
                  capture_output=True, text=True, timeout=5
              ).stdout.split()
              return out[0] if out else "unknown"
          except Exception:
              return "unknown"


      def main():
          meta = get_metadata()
          instance_id = meta.get("uuid", "unknown")
          hostname = meta.get("name", "unknown")
          az = meta.get("availability_zone", "unknown")
          ip_address = get_primary_ip()

          if "-snat-" in hostname:
              vm_type = "snat"
          elif "-fip-" in hostname:
              vm_type = "fip"
          elif "-ext-" in hostname:
              vm_type = "ext"
          else:
              vm_type = "unknown"

          print(f"Starting heartbeat agent")
          print(f"  Instance ID: {instance_id}")
          print(f"  Hostname:    {hostname}")
          print(f"  AZ:          {az}")
          print(f"  VM Type:     {vm_type}")
          print(f"  IP Address:  {ip_address}")
          print(f"  Interval:    {HEARTBEAT_INTERVAL}s")

          ssl_ctx = ssl.create_default_context()
          ssl_ctx.check_hostname = False
          ssl_ctx.verify_mode = ssl.CERT_NONE

          failure_count = 0
          recent_failures = deque(maxlen=MAX_RECENT_FAILURES)

          while True:
              payload = json.dumps({
                  "instance_id": instance_id,
                  "hostname": hostname,
                  "availability_zone": az,
                  "vm_type": vm_type,
                  "ip_address": ip_address,
                  "failure_count": failure_count,
                  "recent_failures": list(recent_failures),
              }).encode()

              try:
                  req = urllib.request.Request(
                      DASHBOARD_URL,
                      data=payload,
                      headers={
                          "Content-Type": "application/json",
                          "X-API-Key": DASHBOARD_API_KEY,
                      },
                  )
                  urllib.request.urlopen(req, timeout=30, context=ssl_ctx)
              except urllib.error.HTTPError as e:
                  failure_count += 1
                  recent_failures.append({
                      "timestamp": datetime.now(timezone.utc).isoformat(),
                      "reason": f"HTTP {e.code}: {e.reason}",
                  })
                  print(f"Heartbeat failed — HTTP {e.code}: {e.reason}")
              except urllib.error.URLError as e:
                  failure_count += 1
                  reason = str(e.reason) if hasattr(e, "reason") else str(e)
                  recent_failures.append({
                      "timestamp": datetime.now(timezone.utc).isoformat(),
                      "reason": f"URLError: {reason}",
                  })
                  print(f"Heartbeat failed — URLError: {reason}")
              except Exception as e:
                  failure_count += 1
                  recent_failures.append({
                      "timestamp": datetime.now(timezone.utc).isoformat(),
                      "reason": str(e)[:256],
                  })
                  print(f"Heartbeat failed — {e}")

              time.sleep(HEARTBEAT_INTERVAL)


      if __name__ == "__main__":
          main()

  - path: /etc/systemd/system/heartbeat-agent.service
    permissions: '0644'
    content: |
      [Unit]
      Description=SNAT Test Heartbeat Agent
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/heartbeat-agent.py
      Restart=always
      RestartSec=10

      [Install]
      WantedBy=multi-user.target

runcmd:
  - systemctl daemon-reload
  - systemctl enable heartbeat-agent.service
  - systemctl start heartbeat-agent.service
